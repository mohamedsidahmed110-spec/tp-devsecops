name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        # Gitleaks scan (avant la compilation)
        - name: Run Gitleaks scan
          uses: zricethezav/gitleaks-action@v2