name: CI/CD democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber1:latest

    steps:
      # 1. Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Analyse Gitleaks (avant la compilation)
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2

      # 3. Installer Java (JDK 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # 5. Build Maven
      - name: Build Java project with Maven
        run: mvn clean package